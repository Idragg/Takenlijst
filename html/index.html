<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>To do</title>
    <link rel="stylesheet" href="../css/site.css">
    <script src="../scripts/note.js"></script>
</head>
<body>
<main>
    <h1 class="hidden-title">To do's</h1>
    <section>
        <h2>To do lijst</h2>
        <div><input type="text" id="taskInput" placeholder="Nieuwe taak..."></div>
        <input type="text" id="taskSummary" placeholder="Beschrijving taak...">
        <button id="addButton">Toevoegen</button>
        <p>Dubbel click om te verwijderen.</p>
    </section>
    <ul id="taskList"></ul>

    <dialog id="confirmModal">
        <p>Weet je zeker dat je deze taak wilt verwijderen?</p>
        <button id="cancelBtn">Annuleren</button>
        <button id="confirmBtn">Verwijderen</button>
    </dialog>
</main>
</body>
</html>
